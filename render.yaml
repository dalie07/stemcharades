# Render blueprint: one free web service runs the whole game (app, API and sockets).
services:
  - type: web
    name: stemcharades
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render terminates TLS in front of the app: trust its X-Forwarded-For so per-IP limits see real clients.
      - key: TRUST_PROXY
        value: "1"
      # Read at build time: the "Flag this card" button opens a prefilled issue in this repository.
      - key: VITE_GITHUB_REPO
        value: dalie07/stemcharades
      # Optional accounts (see docs/setup-accounts.md). Set these in the dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
